<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- 店頭・対面のご相談ツール。検索インデックス不要のため noindex -->
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>はんこ屋ぶんちゃん｜選ぶだけ相談シート</title>
<style>
  /* ===== はんこ屋ぶんちゃん（白＋差し色の赤。サイトと同じ #e8452c）===== */
  :root {
    --red: #e8452c;
    --bg: #ffffff;
    --ink: #23201e;
    --muted: #8b8683;
    --card: #ffffff;
    --line: #e6e2de;
    --primary: var(--red);
    --primary-deep: #c4341e;
    --soft: #fdeeea;
    --shadow: 0 6px 20px rgba(0, 0, 0, .07);
    --radius: 18px;
    --tap: 56px;
    font-synthesis-weight: none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(env(safe-area-inset-top), 12px) 18px calc(env(safe-area-inset-bottom) + 18px);
  }

  /* ===== 共通ヘッダー ===== */
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 2px 14px;
  }
  .brand__mark {
    font-weight: 800; letter-spacing: .02em;
    font-size: 19px; color: var(--primary);
  }
  .brand__sub { font-size: 12px; color: var(--muted); font-weight: 700; }

  /* ===== ボタン共通 ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: var(--tap); padding: 14px 20px;
    border: none; border-radius: 14px; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 16px;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn--primary { background: var(--primary); color: #fff; box-shadow: 0 6px 16px rgba(232,69,44,.28); }
  .btn--primary:hover { background: var(--primary-deep); }
  .btn--ghost { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
  .btn--sub { background: #f2efec; color: var(--ink); }
  .btn--line { background: #06C755; color: #fff; box-shadow: 0 8px 20px rgba(6,199,85,.32); }
  .btn--line:hover { background: #05a948; }
  .btn--lg { min-height: 60px; padding: 20px; font-size: 19px; font-weight: 800; border-radius: 16px; }
  .btn--block { width: 100%; }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn:focus-visible, .card:focus-visible, .opt:focus-visible {
    outline: 3px solid var(--primary); outline-offset: 2px;
  }

  /* ===== 入口画面 ===== */
  .intro { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 8px 0 24px; }
  .intro__eyebrow { color: var(--primary); font-weight: 800; letter-spacing: .14em; font-size: 12px; }
  .intro__h {
    font-size: clamp(28px, 8vw, 40px); font-weight: 800; line-height: 1.25; letter-spacing: -.01em;
  }
  .intro__h em { font-style: normal; color: var(--primary); }
  .intro__lead { color: var(--muted); font-size: 15px; max-width: 42ch; }
  .subjects { display: grid; gap: 12px; margin-top: 6px; }
  .subject {
    display: flex; align-items: center; gap: 14px; text-align: left;
    background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 18px; min-height: var(--tap); cursor: pointer; font: inherit;
    box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s ease;
  }
  .subject:hover { transform: translateY(-2px); border-color: var(--primary); }
  .subject:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; transform: none; }
  .subject__body { flex: 1; }
  .subject__name { font-weight: 800; font-size: 17px; }
  .subject__desc { color: var(--muted); font-size: 13px; }
  .subject__soon { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
  .intro__note { color: var(--muted); font-size: 12px; text-align: center; }

  /* ===== 質問画面 ===== */
  .q { flex: 1; display: flex; flex-direction: column; }
  .qbar { display: flex; align-items: center; gap: 12px; padding: 6px 0 14px; }
  .qbar__back {
    background: #fff; border: 1.5px solid var(--line); border-radius: 999px;
    color: var(--ink); font: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; padding: 8px 16px; min-height: 44px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    transition: border-color .12s ease, color .12s ease, background .12s ease;
  }
  .qbar__back:hover { border-color: var(--primary); color: var(--primary); background: #fff6f4; }
  .qbar__back:active { transform: translateY(1px); }
  .qbar__back:disabled { opacity: 0; pointer-events: none; }
  .progress { flex: 1; }
  .progress__track { height: 8px; background: #eeeae7; border-radius: 999px; overflow: hidden; }
  .progress__fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width .35s cubic-bezier(.2,.8,.2,1); }
  .progress__label { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 6px; letter-spacing: .04em; }
  .q__eyebrow { color: var(--primary); font-weight: 800; letter-spacing: .12em; font-size: 12px; margin-top: 6px; }
  .q__title { font-size: clamp(21px, 5.5vw, 26px); font-weight: 800; line-height: 1.4; margin: 6px 0 4px; }
  .q__note { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .opts { display: grid; gap: 11px; margin: 14px 0 8px; }
  .opt {
    display: flex; align-items: center; gap: 14px; text-align: left; color: var(--ink); /* iPhoneはbuttonの文字を青にする */
    background: var(--card); border: 1.5px solid var(--line); border-radius: 15px;
    padding: 15px 16px; min-height: var(--tap); cursor: pointer; font: inherit;
    transition: transform .1s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .opt:hover { border-color: var(--primary); }
  .opt:active { transform: scale(.99); }
  .opt__num {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center; line-height: 1;
    background: var(--soft); color: var(--primary-deep);
    font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .opt[aria-pressed="true"] .opt__num, .opt.is-picked .opt__num {
    background: var(--primary); color: #fff;
  }
  .opt__label { flex: 1; font-size: 15.5px; font-weight: 600; }
  .q__img { display: block; width: 100%; height: auto; margin: 10px 0 2px; border-radius: 8px; border: 1px solid var(--line); }
  .opt__img { flex-shrink: 0; width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: #fff; border: 1px solid var(--line); }
  .opt__imgw { display: block; width: 100%; max-width: 320px; height: auto; margin-top: 8px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .opt__img--none { display: grid; place-items: center; white-space: pre-line; text-align: center; font-size: 11px; line-height: 1.4; color: var(--muted); background: #f5f2f0; }
  .opt__check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line);
    flex-shrink: 0; display: grid; place-items: center; color: #fff; font-size: 14px;
  }
  .opt[aria-pressed="true"], .opt.is-picked {
    border-color: var(--primary); background: #fff6f4; box-shadow: 0 4px 14px rgba(232,69,44,.14);
  }
  .opt[aria-pressed="true"] .opt__check, .opt.is-picked .opt__check {
    background: var(--primary); border-color: var(--primary);
  }
  .quote-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; color: var(--primary-deep);
    background: var(--soft); border: 1px solid #f7cec6;
    border-radius: 999px; padding: 2px 8px; margin-left: 6px; white-space: nowrap;
  }

  /* 複数選択のときの下部バー */
  .multibar { position: sticky; bottom: 0; padding-top: 10px; margin-top: auto;
    background: linear-gradient(to top, var(--bg) 72%, transparent); }
  .multibar__hint { font-size: 13px; color: var(--muted); margin-bottom: 8px; min-height: 20px; }

  /* 選択直後フィードバック（単一選択） */
  .feedback {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center; padding: 28px;
    background: rgba(43,39,36,.55); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .28s ease;
  }
  .feedback.is-on { opacity: 1; pointer-events: auto; }
  .feedback__card {
    background: var(--card); border-radius: 22px; padding: 26px 24px; max-width: 400px; width: 100%;
    box-shadow: var(--shadow); text-align: center; transform: translateY(10px) scale(.98);
    transition: transform .32s cubic-bezier(.2,.9,.3,1);
  }
  .feedback.is-on .feedback__card { transform: none; }
  .feedback__text { font-size: 17px; font-weight: 700; margin: 12px 0 16px; line-height: 1.6; }
  .feedback__tap { font-size: 12px; color: var(--muted); }

  /* ===== 最終画面（コンセプト）===== */
  .result { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-bottom: 8px; }
  .result__eyebrow { color: var(--primary); font-weight: 800; letter-spacing: .12em; font-size: 12px; }
  .result__h { font-size: clamp(24px, 6.5vw, 32px); font-weight: 800; line-height: 1.3; }
  .concept {
    background: var(--card); border: 1.5px solid var(--line); border-left: 5px solid var(--primary);
    border-radius: var(--radius); padding: 22px 20px; box-shadow: var(--shadow);
    font-size: 16.5px; line-height: 1.95;
  }
  .concept p { margin: 0 0 14px; opacity: 0; transform: translateY(8px); animation: rise .5s ease forwards; }
  .concept p:last-child { margin-bottom: 0; }
  .concept p.is-avoid { color: var(--primary-deep); font-weight: 700; }
  .concept p.is-scope { border-top: 1px dashed var(--line); padding-top: 14px; font-weight: 700; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions .btn--block { grid-column: 1 / -1; }
  .copied { font-size: 13px; color: #1e7e34; font-weight: 700; text-align: center; min-height: 20px; }
  .send-lead { background: #f0fbf4; border: 1.5px solid #b7e6c8; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .send-lead__strong { font-size: 15px; font-weight: 800; color: #0a7a3d; line-height: 1.6; }
  .send-lead__note { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.7; }
  .send-sub { font-size: 12px; color: var(--muted); text-align: center; margin: 14px 0 6px; }

  /* ===== 自由入力・案内・宣言（種目別ヒアリング）===== */
  .field { margin: 14px 0 8px; }
  .field input, .field textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink);
    background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;
    padding: 14px 16px; min-height: var(--tap); -webkit-appearance: none;
  }
  .field textarea { min-height: 120px; line-height: 1.7; resize: vertical; }
  .field input:focus, .field textarea:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 4px 14px rgba(232,69,44,.14);
  }
  .notecard {
    background: var(--soft); border: 1px solid #f7cec6; border-radius: var(--radius);
    padding: 18px; font-size: 14.5px; line-height: 1.85; color: #8a5b52; margin: 14px 0 8px;
  }
  .confirm { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 18px; margin: 14px 0 8px; }
  .confirm__body { font-size: 14px; line-height: 1.85; color: var(--ink); margin-bottom: 8px; }
  .confirm__body ul { margin: 0; padding-left: 1.3em; }
  .confirm__body li { margin: 2px 0; }
  .confirm__check { display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 700; padding: 12px 6px; min-height: var(--tap); }
  .confirm__check input { width: 22px; height: 22px; flex-shrink: 0; accent-color: var(--primary); }
  .intake-note { color: var(--muted); font-size: 12.5px; text-align: center; margin: 4px 0 2px; line-height: 1.7; }

  /* ===== v2：目安価格・欄ごと入力・流れ ===== */
  .opt__hint { display: block; font-size: 12.5px; font-weight: 600; color: var(--primary-deep); margin-top: 2px; }
  .field--labeled { margin: 12px 0 4px; }
  .field__label { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 6px; }
  .field textarea.is-short { min-height: 84px; }
  .estimate { background: #fffaf3; border: 1.5px solid #f3d9a8; border-radius: var(--radius); padding: 18px 18px 16px; }
  .estimate__label { font-size: 12.5px; font-weight: 800; color: #9a6a12; letter-spacing: .08em; }
  .estimate__total { font-size: clamp(24px, 7vw, 30px); font-weight: 800; line-height: 1.35; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
  .estimate__line { font-size: 13.5px; color: var(--ink); line-height: 1.7; }
  .estimate__note { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.7; }
  .after-note { background: var(--soft); border: 1px solid #f7cec6; border-radius: 14px; padding: 14px 16px; font-size: 14px; font-weight: 700; color: var(--primary-deep); line-height: 1.7; }
  .flow { list-style: none; counter-reset: f; display: grid; gap: 6px; }
  .flow li { counter-increment: f; display: flex; gap: 10px; align-items: baseline; font-size: 14px; line-height: 1.6; }
  .flow li::before { content: counter(f); flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--soft); color: var(--primary-deep); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
  .flow__h { font-size: 13px; font-weight: 800; color: var(--muted); margin-bottom: 6px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .concept p { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="wrap" id="app" aria-live="polite"></div>
  <div class="feedback" id="feedback" role="dialog" aria-live="assertive">
    <div class="feedback__card">
      <div class="feedback__text" id="fbText"></div>
      <div class="feedback__tap">タップで次へ</div>
    </div>
  </div>

  <!-- 設定値と質問セットは外部ファイルで分離（横展開＝差し替えのため）。外部読込はGA4の計測タグだけ（config.js の ga4 が空なら読まない） -->
  <script src="config.js"></script>
  <!-- 種目別 質問セット（はんこ屋ぶんちゃんの8品目）-->
  <script src="questions.inkan.js?v=20261120"></script>
  <script src="questions.gomuin.js?v=20261119b"></script>
  <script src="questions.meishi.js"></script>
  <script src="questions.sticker.js"></script>
  <script src="questions.flyer.js"></script>
  <script src="questions.poster.js"></script>
  <script src="questions.goods.js"></script>
  <script src="questions.sonota.js"></script>
  <script>
  (function () {
    'use strict';
    var CFG = window.HEARING_CONFIG || {};
    var SETS = window.HEARING_SETS || {};
    // 後方互換：単体で HEARING_SET だけ読み込まれた場合も動く
    if (window.HEARING_SET) {
      var _k = (window.HEARING_SET.meta || {}).key || 'sonota';
      if (!SETS[_k]) SETS[_k] = window.HEARING_SET;
    }
    // ---- 計測（2026-11-18 社長「C お願いします」）----
    // 開いた／始めた／最後まで来た／LINEボタンを押した の「回数」だけをGA4に送る。
    // ★回答の中身（文字・名前・住所・電話）は絶対に送らない。送るのは種目・版・ご意向・金額が決まったか だけ。
    // ★config.js の ga4 が空なら何もしない（壊れない）。
    var track = (function () {
      var id = CFG.ga4;
      if (!id || !/^G-[A-Z0-9]+$/.test(id)) return function () {};
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', id);
      var sc = document.createElement('script');
      sc.async = true; sc.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(id);
      document.head.appendChild(sc);
      return function (name, params) { try { window.gtag('event', name, params || {}); } catch (e) {} };
    })();
    function setParams(extra) {
      var m = (SET && SET.meta) || {}, p = { sheet: m.key || '-', ver: m.ver || 'v1' };
      Object.keys(extra || {}).forEach(function (k) { p[k] = extra[k]; });
      return p;
    }

    var SET = null;   // 選択中の種目セット（loadSetで確定）
    var QS = [];      // SET.questions

    // 入口に並べる種目（active＝質問セット登録済みのものだけ押せる。順序は指示書§1）
    var SUBJECTS = [
      { key: 'inkan',   name: '印鑑',    desc: '個人印・法人印・3点セット' },
      { key: 'gomuin',  name: 'ゴム印',  desc: 'のべ板・データー印・アドレス印など' },
      { key: 'meishi',  name: '名刺',    desc: 'ショップカード・カード類' },
      { key: 'sticker', name: 'ステッカー', desc: '屋内外・型抜き' },
      { key: 'flyer',   name: 'チラシ',  desc: '片面・両面・折り加工' },
      { key: 'poster',  name: 'ポスター', desc: 'A2以上・掲示用' },
      { key: 'goods',   name: 'グッズ・ノベルティ', desc: '名入れ各種' },
      { key: 'sonota',  name: 'その他',  desc: '上記以外・迷っている方はこちら' },
    ];

    var app = document.getElementById('app');
    var fb = document.getElementById('feedback');
    var fbText = document.getElementById('fbText');

    var state = { screen: 'intro', i: 0, answers: {}, temp: [] };
    var fbTimer = null;

    function hasSet(key) { return Object.prototype.hasOwnProperty.call(SETS, key) && SETS[key] && Array.isArray(SETS[key].questions); }
    function loadSet(key) { SET = hasSet(key) ? SETS[key] : null; QS = (SET && SET.questions) || []; }
    function isVisible(q) { return !q.showIf || !!q.showIf(state.answers); }
    function visibleList() { return QS.filter(isVisible); }
    function isLastVisible(q) { var v = visibleList(); return v.indexOf(q) === v.length - 1; }

    // ---- 小さなDOMヘルパ（innerHTML を使わず textContent で XSS を無効化）----
    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }
    function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
    function header() {
      var b = el('div', 'brand');
      var brand = CFG.brand || {};
      b.appendChild(el('div', 'brand__mark', brand.name || 'はんこ屋ぶんちゃん'));
      if (brand.tagline) b.appendChild(el('div', 'brand__sub', brand.tagline));
      return b;
    }
    function roundLabel(round) {
      // "R3.5 避けたいもの" → "避けたいもの"（顧客に記号は不要）
      return String(round || '').replace(/^R[\d.]+\s*/, '');
    }

    // ================= 入口 =================
    function renderIntro() {
      state.screen = 'intro';
      clear(app);
      app.appendChild(header());
      var wrap = el('div', 'intro');
      wrap.appendChild(el('div', 'intro__eyebrow', 'えらぶだけ・2〜3分'));
      var h = el('h1', 'intro__h');
      h.appendChild(document.createTextNode('何のご相談ですか？'));
      wrap.appendChild(h);
      wrap.appendChild(el('p', 'intro__lead',
        '選ぶだけで、ご希望が整理されて言葉になります。最後にLINEでお店に送れます。'));

      var subjects = el('div', 'subjects');
      SUBJECTS.forEach(function (s) {
        var active = hasSet(s.key);
        var b = document.createElement('button');
        b.className = 'subject'; b.type = 'button'; b.disabled = !active;
        var bd = el('div', 'subject__body');
        bd.appendChild(el('div', 'subject__name', s.name));
        bd.appendChild(el('div', 'subject__desc', active ? s.desc : '準備中'));
        b.appendChild(bd);
        var tag = el('span', 'subject__soon', active ? 'はじめる ›' : '準備中');
        if (active) { tag.style.color = 'var(--primary)'; tag.style.borderColor = 'var(--primary)'; }
        b.appendChild(tag);
        if (active) b.addEventListener('click', function () { startSet(s.key); });
        subjects.appendChild(b);
      });
      wrap.appendChild(subjects);
      wrap.appendChild(el('p', 'intro__note', '回答の中身は、LINEで送るまでお店にも届きません。ページを開いた回数などの「数」だけを数えています。'));
      app.appendChild(wrap);
    }

    function startSet(key) {
      loadSet(key);
      if (!SET) { renderIntro(); return; }
      track('hearing_start', setParams());
      startQuestions();
    }

    function startQuestions() {
      state.screen = 'question'; state.i = 0; state.answers = {}; state.temp = [];
      while (state.i < QS.length && !isVisible(QS[state.i])) state.i++;
      renderQuestion();
    }

    // ================= 質問 =================
    // 進捗バー付きヘッダ（全設問タイプ共通）。分岐を反映した「可視設問の中での位置」で数える
    function qbar(q) {
      var bar = el('div', 'qbar');
      var back = document.createElement('button');
      back.className = 'qbar__back'; back.type = 'button'; back.textContent = '‹ 戻る';
      back.disabled = false;
      back.addEventListener('click', goBack);
      bar.appendChild(back);
      var prog = el('div', 'progress');
      var track = el('div', 'progress__track');
      var fill = el('div', 'progress__fill');
      var vis = visibleList();
      var pos = vis.indexOf(q); if (pos < 0) pos = 0;
      var total = vis.length || QS.length;
      fill.style.width = (pos / total * 100) + '%';
      track.appendChild(fill); prog.appendChild(track);
      prog.appendChild(el('div', 'progress__label', (pos + 1) + ' / ' + total + ' 問目'));
      bar.appendChild(prog);
      requestAnimationFrame(function () { fill.style.width = ((pos + 1) / total * 100) + '%'; });
      return bar;
    }

    function renderQuestion() {
      var q = QS[state.i];
      if (q.type === 'text') { renderText(q); return; }
      if (q.type === 'fields') { renderFields(q); return; }
      if (q.type === 'note') { renderNote(q); return; }
      if (q.type === 'confirm') { renderConfirm(q); return; }
      clear(app);
      app.appendChild(header());
      state.temp = pickedArray(q);

      var qc = el('div', 'q');
      qc.appendChild(qbar(q));
      qc.appendChild(el('div', 'q__eyebrow', roundLabel(q.round)));
      qc.appendChild(el('h2', 'q__title', typeof q.title === 'function' ? q.title(state.answers) : q.title));
      var qn = typeof q.note === 'function' ? q.note(state.answers) : q.note; if (qn) qc.appendChild(el('p', 'q__note', qn));
      if (q.img) {
        var qi = document.createElement('img');
        qi.className = 'q__img'; qi.src = q.img; qi.alt = q.imgAlt || ''; qi.width = 1000; qi.height = 512;
        qc.appendChild(qi);
      }

      var opts = el('div', 'opts');
      var shown = 0;
      q.options.forEach(function (opt, oi) {
        if (opt.showIf && !opt.showIf(state.answers)) return; // 選択肢ごとの出し分け（例：フルネームは15mm以上だけ）
        shown++;
        var b = document.createElement('button');
        b.className = 'opt'; b.type = 'button';
        b.appendChild(el('span', 'opt__num', String(shown)));
        var oimg = typeof opt.img === 'function' ? opt.img(state.answers) : opt.img; // 回答で見本を切り替える（例：名字だけなら「國分」の印面）
        if (oimg) {
          var im = document.createElement('img');
          im.className = 'opt__img'; im.src = oimg; im.alt = ''; im.width = 72; im.height = 72; im.loading = 'lazy';
          b.appendChild(im);
        } else if (oimg === null) {
          b.appendChild(el('span', 'opt__img opt__img--none', '写真\n準備中'));
        }
        var lab = el('span', 'opt__label');
        lab.appendChild(document.createTextNode(opt.label));
        var hint = typeof opt.hint === 'function' ? opt.hint(state.answers) : opt.hint;
        if (hint) lab.appendChild(el('span', 'opt__hint', hint));
        if (opt.imgWide) { // 横長の見本（ゴム印の書体）はラベルの下に幅いっぱいで
          var iw = document.createElement('img');
          iw.className = 'opt__imgw'; iw.src = opt.imgWide; iw.alt = opt.label + 'の見本'; iw.width = 600; iw.height = 208; iw.loading = 'lazy';
          lab.appendChild(iw);
        }
        if (opt.quote) {
          var badge = el('span', 'quote-badge', '※別途お見積り');
          lab.appendChild(badge);
        }
        b.appendChild(lab);
        if (q.multi) {
          var chk = el('span', 'opt__check', '✓');
          b.appendChild(chk);
          b.setAttribute('aria-pressed', state.temp.indexOf(oi) >= 0 ? 'true' : 'false');
          b.addEventListener('click', function () { toggleMulti(q, oi, b, opts); });
        } else {
          b.addEventListener('click', function () { chooseSingle(q, opt); });
        }
        opts.appendChild(b);
      });
      qc.appendChild(opts);

      if (q.multi) {
        var mb = el('div', 'multibar');
        var hint = el('div', 'multibar__hint', '');
        mb.appendChild(hint);
        var next = document.createElement('button');
        next.className = 'btn btn--primary btn--block';
        next.type = 'button';
        next.textContent = isLastVisible(q) ? '入力内容を確認' : '次へ ›';
        next.addEventListener('click', function () { confirmMulti(q); });
        mb.appendChild(next);
        qc.appendChild(mb);
        updateMultiHint(q, hint, next);
      }
      app.appendChild(qc);
    }

    function pickedArray(q) {
      var a = state.answers[q.id];
      if (!q.multi) return [];
      if (!Array.isArray(a)) return [];
      return a.map(function (opt) { return q.options.indexOf(opt); }).filter(function (x) { return x >= 0; });
    }

    function updateMultiHint(q, hint, nextBtn) {
      var n = state.temp.length;
      if (n === 0) { hint.textContent = '当てはまるものを選んでください（なければ「特にない」を選択）'; }
      else {
        var labels = state.temp.map(function (i) { return q.options[i].label; });
        hint.textContent = '選択中：' + labels.join('、');
      }
      if (nextBtn) nextBtn.disabled = n === 0;
    }

    function toggleMulti(q, oi, btn, optsWrap) {
      var opt = q.options[oi];
      var pos = state.temp.indexOf(oi);
      if (opt.none) {
        // 「特にない/おまかせ」は排他：他を全部外して自分だけ
        state.temp = pos >= 0 ? [] : [oi];
      } else {
        if (pos >= 0) state.temp.splice(pos, 1);
        else {
          state.temp.push(oi);
          // none枠が入っていたら外す
          state.temp = state.temp.filter(function (i) { return !q.options[i].none; });
        }
      }
      // 表示同期
      Array.prototype.forEach.call(optsWrap.children, function (child, idx) {
        child.setAttribute('aria-pressed', state.temp.indexOf(idx) >= 0 ? 'true' : 'false');
      });
      var mb = optsWrap.parentNode.querySelector('.multibar');
      if (mb) updateMultiHint(q, mb.querySelector('.multibar__hint'), mb.querySelector('.btn'));
    }

    function confirmMulti(q) {
      if (!state.temp.length) return;
      state.answers[q.id] = state.temp.map(function (i) { return q.options[i]; });
      advance();
    }

    function chooseSingle(q, opt) {
      state.answers[q.id] = opt;
      showFeedback(opt, function () { advance(); });
    }

    // ---- 選択直後フィードバック（単一選択）----
    function showFeedback(opt, done) {
      if (!opt.feedback) { done(); return; }
      fbText.textContent = opt.feedback;
      fb.classList.add('is-on');
      var closed = false;
      function close() {
        if (closed) return; closed = true;
        clearTimeout(fbTimer);
        fb.classList.remove('is-on');
        fb.removeEventListener('click', close);
        setTimeout(done, 180);
      }
      fb.addEventListener('click', close);
      fbTimer = setTimeout(close, 1500);
    }

    function advance() {
      var j = state.i + 1;
      while (j < QS.length && !isVisible(QS[j])) j++;   // 分岐で非表示になる設問は飛ばす
      if (j >= QS.length) { renderResult(); return; }
      state.i = j;
      renderQuestion();
      window.scrollTo(0, 0);
    }
    function goBack() {
      var j = state.i - 1;
      while (j >= 0 && !isVisible(QS[j])) j--;
      if (j < 0) { renderIntro(); window.scrollTo(0, 0); return; }   // 先頭から戻る＝種目選択へ
      state.i = j;
      renderQuestion();
      window.scrollTo(0, 0);
    }

    // ---- 自由入力（1行 input / 複数行 textarea）----
    function renderText(q) {
      clear(app); app.appendChild(header());
      var qc = el('div', 'q');
      qc.appendChild(qbar(q));
      qc.appendChild(el('div', 'q__eyebrow', roundLabel(q.round)));
      qc.appendChild(el('h2', 'q__title', typeof q.title === 'function' ? q.title(state.answers) : q.title));
      var qn = typeof q.note === 'function' ? q.note(state.answers) : q.note; if (qn) qc.appendChild(el('p', 'q__note', qn));
      var field = el('div', 'field');
      var input = document.createElement(q.multiline ? 'textarea' : 'input');
      if (!q.multiline) input.type = 'text';
      input.value = state.answers[q.id] || '';
      var ph = typeof q.placeholder === 'function' ? q.placeholder(state.answers) : q.placeholder; if (ph) input.placeholder = ph;
      if (q.inputmode) input.setAttribute('inputmode', q.inputmode);
      field.appendChild(input);
      qc.appendChild(field);
      var mb = el('div', 'multibar');
      mb.appendChild(el('div', 'multibar__hint', q.optional ? '任意です（空欄でも次へ進めます）' : ''));
      var next = document.createElement('button');
      next.className = 'btn btn--primary btn--block'; next.type = 'button';
      next.textContent = isLastVisible(q) ? '入力内容を確認' : '次へ ›';
      function sync() { next.disabled = !q.optional && !input.value.trim(); }
      input.addEventListener('input', sync); sync();
      next.addEventListener('click', function () { state.answers[q.id] = input.value.trim(); advance(); });
      mb.appendChild(next);
      qc.appendChild(mb);
      app.appendChild(qc);
      window.scrollTo(0, 0);
    }

    // ---- 複数欄の入力（印面の会社名・住所・電話などを欄ごとに）----
    // q.fields=[{key,label,placeholder,multiline,inputmode}]（関数も可）・q.needAny=[key...]（どれか1つ入れば進める）
    function renderFields(q) {
      clear(app); app.appendChild(header());
      var qc = el('div', 'q');
      qc.appendChild(qbar(q));
      qc.appendChild(el('div', 'q__eyebrow', roundLabel(q.round)));
      qc.appendChild(el('h2', 'q__title', typeof q.title === 'function' ? q.title(state.answers) : q.title));
      var qn = typeof q.note === 'function' ? q.note(state.answers) : q.note; if (qn) qc.appendChild(el('p', 'q__note', qn));
      var prev = state.answers[q.id] || {};
      var fields = typeof q.fields === 'function' ? q.fields(state.answers) : q.fields;
      var need = (typeof q.needAny === 'function' ? q.needAny(state.answers) : q.needAny) || [];
      var inputs = {};
      fields.forEach(function (f) {
        var box = el('div', 'field field--labeled');
        var lab = el('label', 'field__label', f.label + (need.indexOf(f.key) >= 0 ? '' : '（任意）'));
        var input = document.createElement(f.multiline ? 'textarea' : 'input');
        if (!f.multiline) input.type = 'text'; else input.className = 'is-short';
        input.id = 'f_' + q.id + '_' + f.key; lab.htmlFor = input.id;
        input.value = (prev.values && prev.values[f.key]) || '';
        if (f.placeholder) input.placeholder = f.placeholder;
        if (f.inputmode) input.setAttribute('inputmode', f.inputmode);
        box.appendChild(lab); box.appendChild(input);
        qc.appendChild(box);
        inputs[f.key] = input;
      });
      var mb = el('div', 'multibar');
      var hint = el('div', 'multibar__hint', '');
      mb.appendChild(hint);
      var next = document.createElement('button');
      next.className = 'btn btn--primary btn--block'; next.type = 'button';
      next.textContent = isLastVisible(q) ? '入力内容を確認' : '次へ ›';
      function sync() {
        var ok = !need.length || need.some(function (k) { return inputs[k] && inputs[k].value.trim(); });
        next.disabled = !ok;
        hint.textContent = ok ? '' : (q.needHint || '印面に入れる文字を入力してください');
      }
      Object.keys(inputs).forEach(function (k) { inputs[k].addEventListener('input', sync); });
      sync();
      next.addEventListener('click', function () {
        var v = { values: {}, labels: {} };
        fields.forEach(function (f) { var t = inputs[f.key].value.trim(); if (t) { v.values[f.key] = t; v.labels[f.key] = f.label; } });
        state.answers[q.id] = v; advance();
      });
      mb.appendChild(next);
      qc.appendChild(mb);
      app.appendChild(qc);
      window.scrollTo(0, 0);
    }

    // ---- 案内（入力なし・アップロードの代替導線など）----
    function renderNote(q) {
      clear(app); app.appendChild(header());
      var qc = el('div', 'q');
      qc.appendChild(qbar(q));
      qc.appendChild(el('div', 'q__eyebrow', roundLabel(q.round)));
      qc.appendChild(el('h2', 'q__title', typeof q.title === 'function' ? q.title(state.answers) : q.title));
      var card = el('div', 'notecard');
      (Array.isArray(q.body) ? q.body : [q.body || '']).forEach(function (line, i) {
        if (i) card.appendChild(document.createElement('br'));
        card.appendChild(document.createTextNode(line));
      });
      qc.appendChild(card);
      var mb = el('div', 'multibar');
      mb.appendChild(el('div', 'multibar__hint', ''));
      var next = document.createElement('button');
      next.className = 'btn btn--primary btn--block'; next.type = 'button';
      next.textContent = isLastVisible(q) ? '入力内容を確認' : '次へ ›';
      next.addEventListener('click', advance);
      mb.appendChild(next);
      qc.appendChild(mb);
      app.appendChild(qc);
      window.scrollTo(0, 0);
    }

    // ---- やらないこと宣言（チェック必須）----
    function renderConfirm(q) {
      clear(app); app.appendChild(header());
      var qc = el('div', 'q');
      qc.appendChild(qbar(q));
      qc.appendChild(el('div', 'q__eyebrow', roundLabel(q.round)));
      qc.appendChild(el('h2', 'q__title', typeof q.title === 'function' ? q.title(state.answers) : q.title));
      var box = el('div', 'confirm');
      var body = el('div', 'confirm__body');
      var ul = document.createElement('ul');
      (q.body || []).forEach(function (line) { var li = document.createElement('li'); li.textContent = line; ul.appendChild(li); });
      body.appendChild(ul);
      box.appendChild(body);
      var label = el('label', 'confirm__check');
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!state.answers[q.id];
      label.appendChild(cb);
      label.appendChild(document.createTextNode(q.checkLabel || '確認しました'));
      box.appendChild(label);
      qc.appendChild(box);
      var mb = el('div', 'multibar');
      mb.appendChild(el('div', 'multibar__hint', ''));
      var next = document.createElement('button');
      next.className = 'btn btn--primary btn--block'; next.type = 'button';
      next.textContent = isLastVisible(q) ? '入力内容を確認' : '次へ ›';
      function sync() { next.disabled = !cb.checked; }
      cb.addEventListener('change', sync); sync();
      next.addEventListener('click', function () { state.answers[q.id] = cb.checked; advance(); });
      mb.appendChild(next);
      qc.appendChild(mb);
      app.appendChild(qc);
      window.scrollTo(0, 0);
    }

    // ---- 受付内容まとめ（種目別の出力＝スタッフがDenpyo-BOTへ貼る）----
    function buildSummary() {
      var lines = [];
      var meta = SET.meta || {};
      lines.push('【' + (meta.label || '受付') + (meta.ver ? '・' + meta.ver : '') + '】ヒアリング内容');
      lines.push('');
      QS.forEach(function (q) {
        if (!isVisible(q) || q.type === 'note' || q.type === 'confirm') return;
        var a = state.answers[q.id], val = '';
        if (q.type === 'fields') {
          if (!a || !a.values) return;
          var keys = Object.keys(a.values); if (!keys.length) return;
          lines.push('■ ' + (q.sum || q.title) + '：');
          keys.forEach(function (k) { lines.push('　' + a.labels[k] + '：' + a.values[k].replace(/\n/g, ' / ')); });
          return;
        }
        if (q.type === 'text') { val = (a || '').trim(); if (!val) return; }
        else if (q.multi) { if (!Array.isArray(a) || !a.length) return; val = a.map(function (o) { return o.label; }).join('・'); }
        else { if (!a) return; val = a.label; }
        lines.push('■ ' + (q.sum || q.title) + '：' + val);
      });
      var confirmed = QS.filter(function (q) { return q.type === 'confirm' && isVisible(q) && state.answers[q.id]; });
      if (confirmed.length) { lines.push(''); lines.push('※「ご確認事項」を確認済み'); }
      var est = getEstimate();
      if (est) {
        lines.push('');
        lines.push('■ ' + (est.label === 'お値段' ? '金額' : '目安金額') + '：' + est.total);
        (est.lines || []).forEach(function (l) { lines.push('　' + l); });
      }
      return lines.join('\n');
    }

    // 種目ごとの目安金額（SET.estimate があるときだけ）。visible(id) で分岐中の設問だけを使わせる
    function getEstimate() {
      if (!SET || typeof SET.estimate !== 'function') return null;
      try {
        return SET.estimate(state.answers, function (id) {
          var q = QS.filter(function (x) { return x.id === id; })[0];
          return !!q && isVisible(q);
        });
      } catch (e) { return null; }
    }

    // ================= 最終画面 =================
    function renderResult() {
      state.screen = 'result';
      clear(app);
      app.appendChild(header());
      renderIntakeResult();
      var est = getEstimate(), g18 = state.answers.G18;
      track('hearing_result', setParams({ intent: (g18 && g18.val) || '-', fixed: est && est.fixed ? 'yes' : 'no' }));
      window.scrollTo(0, 0);
    }

    // 共通アクション（LINEで送る＝最上段・最大／コピー・共有＝下段／やり直し）
    function resultActions(text) {
      var box = el('div');
      var copied = el('div', 'copied', '');

      // 注意文（送信して初めて届く旨）
      var lead = el('div', 'send-lead');
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent || '');
      var oaId = CFG.line && CFG.line.oaId;
      var useOa = mobile && !!oaId;
      lead.appendChild(el('div', 'send-lead__strong', '送信して初めてご依頼が届きます。このままLINEで送ってください'));
      lead.appendChild(el('div', 'send-lead__note', useOa
        ? 'ボタンを押すと、お店のLINEに内容が入った状態で開きます。そのまま送信を押してください。'
        : 'ボタンを押すとご希望の内容をコピーします。LINEのトーク画面に貼り付けて送信してください。'));

      // LINEで送る（最上段・最大）
      var lineBtn = document.createElement('button');
      lineBtn.className = 'btn btn--line btn--lg btn--block'; lineBtn.type = 'button';
      lineBtn.textContent = 'LINEで送る';
      lineBtn.addEventListener('click', function () {
        track('hearing_line', setParams({ how: useOa ? 'oa' : 'copy' }));
        // 入らなかったときの予備に、どちらの場合もコピーはしておく
        copyText(text, copied, useOa
          ? '✓ LINEを開きます。文が入っていないときは、トークに貼り付けて送信してください'
          : '✓ 内容をコピーしました。LINEのトークに貼り付けて送信してください');
        if (useOa) {
          location.href = 'https://line.me/R/oaMessage/' + encodeURIComponent(oaId) + '/?' + encodeURIComponent(text);
        } else {
          window.open((CFG.line && CFG.line.url) || 'https://lin.ee/Q52XPutI', '_blank', 'noopener');
        }
      });

      // 下段：コピー・共有（格下げ）
      var actions = el('div', 'actions');
      var copyBtn = document.createElement('button');
      copyBtn.className = 'btn btn--ghost'; copyBtn.type = 'button'; copyBtn.textContent = 'コピー';
      copyBtn.addEventListener('click', function () { copyText(text, copied); });
      var shareBtn = document.createElement('button');
      shareBtn.className = 'btn btn--ghost'; shareBtn.type = 'button'; shareBtn.textContent = '共有';
      shareBtn.addEventListener('click', function () { shareText(text, copied); });
      var restart = document.createElement('button');
      restart.className = 'btn btn--sub btn--block'; restart.type = 'button'; restart.textContent = '最初からやり直す';
      restart.addEventListener('click', function () {
        if (confirm('回答をリセットして最初からやり直しますか？')) { renderIntro(); window.scrollTo(0, 0); }
      });
      actions.appendChild(copyBtn); actions.appendChild(shareBtn); actions.appendChild(restart);

      box.appendChild(lead);
      box.appendChild(lineBtn);
      box.appendChild(copied);
      box.appendChild(el('div', 'send-sub', 'コピーだけしたいときは下のボタンから'));
      box.appendChild(actions);
      return box;
    }

    // 種目別：受付内容まとめ（スタッフがDenpyo-BOTへ貼る）
    function renderIntakeResult() {
      // 並び（2026-11-18）：金額 → LINEで送る → 送ったあとのお願い → 送る内容 → このあとの流れ
      //   スマホで何画面もめくらないとボタンが出なかったため、ボタンを上へ。
      var r = el('div', 'result');
      r.appendChild(el('div', 'result__eyebrow', 'ありがとうございます'));
      r.appendChild(el('h2', 'result__h', 'ご希望の受付内容'));
      var text = buildSummary();

      var est = getEstimate();
      if (est) {
        var eb = el('div', 'estimate');
        eb.appendChild(el('div', 'estimate__label', est.label || '目安の金額'));
        eb.appendChild(el('div', 'estimate__total', est.total));
        (est.lines || []).forEach(function (l) { eb.appendChild(el('div', 'estimate__line', l)); });
        eb.appendChild(el('div', 'estimate__note', est.note || '正式な金額は、内容を確認してお店からお知らせします。'));
        r.appendChild(eb);
      }
      r.appendChild(resultActions(text));

      // 送ったあとにやること（写真・ロゴ・数・日にち・お店の場所）はボタンのすぐ下
      var notes = typeof SET.afterNotes === 'function' ? (SET.afterNotes(state.answers) || []) : [];
      notes.forEach(function (n) { r.appendChild(el('div', 'after-note', n)); });

      r.appendChild(el('div', 'flow__h', 'お店に送る内容'));
      var concept = el('div', 'concept');
      text.split(/\n/).forEach(function (line) { concept.appendChild(el('p', null, line || ' ')); });
      r.appendChild(concept);

      var flow = typeof SET.flow === 'function' ? SET.flow(state.answers) : SET.flow;
      if (Array.isArray(flow) && flow.length) {
        var fw = el('div');
        fw.appendChild(el('div', 'flow__h', 'このあとの流れ'));
        var ol = el('ol', 'flow');
        flow.forEach(function (st) { ol.appendChild(el('li', null, st)); });
        fw.appendChild(ol);
        r.appendChild(fw);
      } else {
        r.appendChild(el('p', 'intake-note',
          'この内容を確認してご連絡します（送信＝ご注文確定ではありません）。お見積りは内容をもとに担当がご案内します。'));
      }
      app.appendChild(r);
    }

    // ---- コピー / 共有 ----
    function flash(node, msg, ok) {
      node.textContent = msg;
      node.style.color = ok === false ? 'var(--primary)' : '#1e7e34';
      clearTimeout(node._t);
      node._t = setTimeout(function () { node.textContent = ''; }, 2600);
    }
    function copyText(text, node, okMsg) {
      var msg = okMsg || '✓ コピーしました';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { flash(node, msg, true); },
          function () { legacyCopy(text, node, okMsg); }
        );
      } else { legacyCopy(text, node, okMsg); }
    }
    function legacyCopy(text, node, okMsg) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        flash(node, ok ? (okMsg || '✓ コピーしました') : 'コピーできませんでした。長押しで選択してください', ok);
      } catch (e) {
        flash(node, 'コピーできませんでした。長押しで選択してください', false);
      }
    }
    function shareText(text, node) {
      if (navigator.share) {
        navigator.share({ title: 'はんこ屋ぶんちゃんへのご相談', text: text }).catch(function () {});
      } else {
        copyText(text, node);
        flash(node, '✓ コピーしました（共有先に貼り付けてください）', true);
      }
    }

    // ?s=種目キー があればその種目へ直行（店頭タブレット／直リンク用）。無ければ種目選択へ
    function boot() {
      var key = '';
      try { key = new URLSearchParams(location.search).get('s') || ''; } catch (e) { key = ''; }
      track('hearing_open', { sheet: key || '-' });
      if (key && hasSet(key)) startSet(key);
      else renderIntro();
    }
    boot();
  })();
  </script>
</body>
